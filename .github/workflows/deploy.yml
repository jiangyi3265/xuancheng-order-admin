name: Build and package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Deployment is managed at jiedanxt.oksja.cn. The legacy host and AI worker
# deployment have been retired; this workflow only produces release artifacts.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: xuancheng-order-admin
          path: dist/
          if-no-files-found: error
